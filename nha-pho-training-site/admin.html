<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Nhà Phố Training</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --green:  #00A651; --green-dark: #007A3D; --green-bg: #E5EDE5;
  --white:  #FFFFFF; --text: #1A1A1A; --muted: #666;
  --border: #E0E0E0; --error: #E53935; --warn: #F59E0B;
  --font: 'Be Vietnam Pro', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: #f4f6f8; color: var(--text); }
button { font-family: var(--font); cursor: pointer; border: none; background: none; }
input, textarea, select { font-family: var(--font); }

/* ── Auth overlay ── */
#auth-overlay {
  position: fixed; inset: 0;
  background: var(--green-bg);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999;
}
.auth-box {
  background: white; border-radius: 16px; padding: 36px 32px;
  box-shadow: 0 8px 40px rgba(0,0,0,.12);
  text-align: center; min-width: 300px;
}
.auth-box h2 { color: var(--green); margin-bottom: 8px; }
.auth-box p  { color: var(--muted); font-size: .85rem; margin-bottom: 20px; }
.auth-box input {
  width: 100%; padding: 10px 14px; border-radius: 10px;
  border: 1.5px solid var(--border); font-size: .9rem;
  margin-bottom: 12px; outline: none;
}
.auth-box input:focus { border-color: var(--green); }
.btn-primary {
  width: 100%; padding: 11px; border-radius: 10px;
  background: var(--green); color: white;
  font-size: .9rem; font-weight: 600;
}
.btn-primary:hover { background: var(--green-dark); }
#auth-err { color: var(--error); font-size: .8rem; margin-top: 8px; display: none; }

/* ── Layout ── */
#admin { display: none; min-height: 100vh; }

.top-bar {
  background: white; border-bottom: 1px solid var(--border);
  padding: 0 24px; height: 54px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 1px 6px rgba(0,0,0,.07);
}
.top-bar h1 { font-size: 1rem; font-weight: 700; color: var(--green); }
.top-bar .actions { display: flex; gap: 10px; }

.btn-sm {
  padding: 7px 14px; border-radius: 8px;
  font-size: .8rem; font-weight: 600;
  transition: all .15s;
}
.btn-outline {
  border: 1.5px solid var(--border); color: var(--muted);
  background: white;
}
.btn-outline:hover { border-color: var(--green); color: var(--green); }
.btn-green { background: var(--green); color: white; }
.btn-green:hover { background: var(--green-dark); }
.btn-warn { background: var(--warn); color: white; }

.body-wrap {
  display: grid; grid-template-columns: 260px 1fr;
  height: calc(100vh - 54px);
}

/* ── Left: module selector ── */
.module-list {
  background: white; border-right: 1px solid var(--border);
  overflow-y: auto; padding: 16px 0;
}
.module-list h3 {
  font-size: .72rem; font-weight: 700; letter-spacing: .07em;
  text-transform: uppercase; color: var(--muted);
  padding: 0 16px 10px;
}
.mod-item {
  padding: 10px 16px; cursor: pointer; display: flex;
  align-items: center; gap: 10px;
  border-left: 3px solid transparent;
  transition: all .15s;
}
.mod-item:hover { background: var(--green-bg); }
.mod-item.active { background: rgba(0,166,81,.1); border-left-color: var(--green); }
.mod-item .mod-icon { font-size: 1.2rem; }
.mod-item .mod-info .mod-name { font-size: .85rem; font-weight: 600; }
.mod-item .mod-info .mod-meta { font-size: .72rem; color: var(--muted); }
.mod-item.active .mod-name { color: var(--green); }

/* ── Right: editor ── */
.editor-area {
  overflow-y: auto; padding: 24px;
  display: flex; flex-direction: column; gap: 20px;
}

.editor-header {
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 12px;
}
.editor-header h2 { font-size: 1.1rem; font-weight: 700; }
.editor-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* Validate banner */
#validate-banner {
  display: none; padding: 10px 16px; border-radius: 10px;
  font-size: .82rem; font-weight: 500;
}
#validate-banner.ok  { background: rgba(0,166,81,.1); color: var(--green-dark); border: 1px solid rgba(0,166,81,.25); }
#validate-banner.err { background: rgba(229,57,53,.08); color: var(--error); border: 1px solid rgba(229,57,53,.2); }

/* Step accordion ── */
.step-card {
  background: white; border-radius: 12px;
  border: 1.5px solid var(--border);
  overflow: hidden; transition: border-color .15s;
}
.step-card.has-todo { border-color: var(--warn); }
.step-card.valid    { border-color: rgba(0,166,81,.4); }

.step-head {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 16px; cursor: pointer;
  user-select: none;
}
.step-head:hover { background: #fafafa; }
.step-badge {
  min-width: 28px; height: 28px; border-radius: 50%;
  background: var(--green-bg); border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0;
}
.step-card.has-todo .step-badge { background: rgba(245,158,11,.15); border-color: var(--warn); color: var(--warn); }
.step-card.valid    .step-badge { background: rgba(0,166,81,.15); border-color: var(--green); color: var(--green-dark); }

.step-head-text { flex: 1; }
.step-head-name { font-size: .87rem; font-weight: 600; }
.step-head-meta { font-size: .72rem; color: var(--muted); margin-top: 2px; }
.step-head-arrow { color: var(--muted); transition: transform .2s; font-size: .9rem; }
.step-card.open .step-head-arrow { transform: rotate(180deg); }

.step-body { display: none; padding: 16px; border-top: 1px solid var(--border); }
.step-card.open .step-body { display: block; }

/* Form fields in step */
.field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.field-grid.full { grid-template-columns: 1fr; }
.field-label {
  font-size: .72rem; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: .05em;
  margin-bottom: 4px;
}
.field-label span { color: var(--error); }
.field-hint { font-size: .68rem; color: #aaa; margin-top: 2px; }

.f-input, .f-select, .f-textarea {
  width: 100%; padding: 8px 10px;
  border: 1.5px solid var(--border); border-radius: 8px;
  font-size: .82rem; color: var(--text); outline: none;
  transition: border-color .15s;
}
.f-input:focus, .f-select:focus, .f-textarea:focus { border-color: var(--green); }
.f-input.warn, .f-textarea.warn { border-color: var(--warn); background: rgba(245,158,11,.04); }
.f-textarea { resize: vertical; min-height: 64px; }

/* word count badge */
.wc-badge {
  display: inline-block; font-size: .65rem; padding: 1px 6px;
  border-radius: 10px; margin-left: 6px; font-weight: 700;
}
.wc-ok  { background: rgba(0,166,81,.1);  color: var(--green); }
.wc-err { background: rgba(229,57,53,.1); color: var(--error); }

/* Hotspot coords */
.hs-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
.hs-grid label { display: flex; flex-direction: column; gap: 4px; font-size: .72rem; color: var(--muted); font-weight: 600; }
.hs-grid input { padding: 7px 8px; border: 1.5px solid var(--border); border-radius: 7px; font-size: .82rem; text-align: center; outline: none; }
.hs-grid input:focus { border-color: var(--green); }

/* Guide items */
.guide-list { display: flex; flex-direction: column; gap: 8px; }
.guide-entry {
  background: #f8f8f8; border-radius: 8px; padding: 10px;
  border: 1px solid var(--border);
}
.guide-entry-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 6px;
}
.guide-entry-num { font-size: .72rem; font-weight: 700; color: var(--muted); }
.btn-del-guide {
  font-size: .7rem; color: var(--error); padding: 2px 6px;
  border-radius: 5px; border: 1px solid rgba(229,57,53,.2);
}
.btn-del-guide:hover { background: rgba(229,57,53,.08); }
.btn-add-guide {
  margin-top: 8px; font-size: .78rem; color: var(--green);
  padding: 7px 12px; border-radius: 8px;
  border: 1.5px dashed rgba(0,166,81,.4);
  width: 100%; transition: all .15s;
}
.btn-add-guide:hover { background: var(--green-bg); }

/* Preview iframe */
#preview-wrap {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.5); z-index: 500;
  align-items: center; justify-content: center;
}
#preview-wrap.show { display: flex; }
.preview-box {
  background: white; border-radius: 16px;
  width: min(1100px, 95vw); height: 90vh;
  display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
}
.preview-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 20px; border-bottom: 1px solid var(--border);
}
.preview-bar h3 { font-size: .9rem; font-weight: 700; }
.btn-close-preview {
  font-size: 1.2rem; color: var(--muted); padding: 4px 8px; border-radius: 6px;
}
.btn-close-preview:hover { background: #f0f0f0; }
#preview-frame { flex: 1; border: none; }

/* Toast */
#toast {
  position: fixed; bottom: 24px; right: 24px;
  background: #333; color: white; padding: 10px 18px;
  border-radius: 10px; font-size: .82rem; font-weight: 500;
  z-index: 9990; opacity: 0; transform: translateY(8px);
  transition: all .25s; pointer-events: none;
}
#toast.show { opacity: 1; transform: none; }

/* Empty state */
.empty-state {
  text-align: center; color: var(--muted); padding: 60px 20px;
}
.empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
</style>
</head>
<body>

<!-- Auth -->
<div id="auth-overlay">
  <div class="auth-box">
    <div style="font-size:2rem;margin-bottom:8px">🏠</div>
    <h2>Nhà Phố Admin</h2>
    <p>Dashboard chỉnh sửa content training</p>
    <input type="password" id="pw-input" placeholder="Mật khẩu..." onkeydown="if(event.key==='Enter')checkAuth()">
    <button class="btn-primary" onclick="checkAuth()">Đăng nhập</button>
    <div id="auth-err">Sai mật khẩu</div>
  </div>
</div>

<!-- Admin app -->
<div id="admin">
  <div class="top-bar">
    <h1>🏠 Nhà Phố Admin — Content Editor</h1>
    <div class="actions">
      <button class="btn-sm btn-outline" onclick="validateAll()">✓ Validate</button>
      <button class="btn-sm btn-outline" onclick="showPreview()">👁 Preview</button>
      <button class="btn-sm btn-green"   onclick="exportJSON()">⬇ Export JSON</button>
      <a href="index.html" class="btn-sm btn-outline" style="display:flex;align-items:center">← Trang chủ</a>
    </div>
  </div>

  <div class="body-wrap">
    <!-- Module list -->
    <div class="module-list">
      <h3>Modules</h3>
      <div id="mod-list-items"></div>
    </div>

    <!-- Editor -->
    <div class="editor-area" id="editor-area">
      <div class="empty-state">
        <div class="icon">📋</div>
        <p>Chọn module bên trái để chỉnh sửa</p>
      </div>
    </div>
  </div>
</div>

<!-- Preview -->
<div id="preview-wrap">
  <div class="preview-box">
    <div class="preview-bar">
      <h3 id="preview-title">Preview</h3>
      <button class="btn-close-preview" onclick="closePreview()">✕</button>
    </div>
    <iframe id="preview-frame" src=""></iframe>
  </div>
</div>

<div id="toast"></div>

<script>
// ── Auth ──────────────────────────────────────────────────────────────
const ADMIN_PASS = 'nhapho2026';
function checkAuth() {
  const v = document.getElementById('pw-input').value;
  if (v === ADMIN_PASS) {
    document.getElementById('auth-overlay').style.display = 'none';
    document.getElementById('admin').style.display = 'block';
    loadData();
  } else {
    document.getElementById('auth-err').style.display = 'block';
  }
}
document.getElementById('pw-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkAuth();
});

// ── State ─────────────────────────────────────────────────────────────
let DATA     = null;   // full modules.json
let CUR_MOD  = null;   // current module id
let DIRTY    = {};     // modified module ids

// ── Load ──────────────────────────────────────────────────────────────
async function loadData() {
  try {
    const r = await fetch('data/modules.json');
    DATA = await r.json();
    renderModuleList();
  } catch(e) {
    showToast('❌ Không load được modules.json: ' + e.message);
  }
}

// ── Module list ───────────────────────────────────────────────────────
function renderModuleList() {
  const mods = DATA?.modules || {};
  const html = Object.entries(mods).map(([id, m]) => `
    <div class="mod-item ${id === CUR_MOD ? 'active' : ''}" onclick="selectModule('${id}')">
      <span class="mod-icon">${m.icon || '📱'}</span>
      <div class="mod-info">
        <div class="mod-name">${m.name || id}</div>
        <div class="mod-meta">${(m.steps||[]).length} bước · ${m.role || ''}</div>
      </div>
    </div>
  `).join('');
  document.getElementById('mod-list-items').innerHTML = html;
}

// ── Select module ─────────────────────────────────────────────────────
function selectModule(id) {
  CUR_MOD = id;
  renderModuleList(); // update active
  renderEditor(id);
}

// ── Editor ────────────────────────────────────────────────────────────
function renderEditor(id) {
  const mod   = DATA.modules[id];
  const steps = mod.steps || [];
  const area  = document.getElementById('editor-area');

  area.innerHTML = `
    <div class="editor-header">
      <h2>${mod.icon || ''} ${mod.name}
        <small style="font-size:.75rem;color:var(--muted);font-weight:400"> · ${steps.length} bước · ${mod.role}</small>
      </h2>
      <div class="editor-actions">
        <button class="btn-sm btn-outline" onclick="validateModule('${id}')">✓ Validate module</button>
        <button class="btn-sm btn-warn"    onclick="checkTodos('${id}')">🔍 TODO còn lại</button>
        <button class="btn-sm btn-green"   onclick="showPreview()">👁 Preview</button>
      </div>
    </div>
    <div id="validate-banner"></div>
    ${steps.map((s,i) => renderStepCard(id, s, i)).join('')}
  `;
}

// ── Step card ─────────────────────────────────────────────────────────
function renderStepCard(modId, step, idx) {
  const hasTodo = JSON.stringify(step).includes('TODO');
  return `
  <div class="step-card ${hasTodo ? 'has-todo' : ''}" id="sc-${modId}-${step.id}">
    <div class="step-head" onclick="toggleStep('sc-${modId}-${step.id}')">
      <div class="step-badge">${step.id}</div>
      <div class="step-head-text">
        <div class="step-head-name">${step.name || `Bước ${step.id}`}</div>
        <div class="step-head-meta">
          ${step.img ? `img: ${step.img}` : ''} ·
          ttPos: ${step.ttPos || '?'} ·
          ${hasTodo ? '<span style="color:var(--warn)">⚠ có TODO</span>' : '<span style="color:var(--green)">✓ ok</span>'}
        </div>
      </div>
      <span class="step-head-arrow">▼</span>
    </div>
    <div class="step-body">
      ${buildStepForm(modId, step)}
    </div>
  </div>`;
}

function buildStepForm(modId, step) {
  const g = step.guide || [];
  return `
  <!-- Row 1: name + title -->
  <div class="field-grid">
    <div>
      <div class="field-label">name <span>*</span></div>
      <input class="f-input" value="${esc(step.name||'')}"
        onchange="updateField('${modId}',${step.id},'name',this.value)">
    </div>
    <div>
      <div class="field-label">title</div>
      <input class="f-input" value="${esc(step.title||'')}"
        onchange="updateField('${modId}',${step.id},'title',this.value)">
    </div>
  </div>
  <!-- sub + tip -->
  <div class="field-grid">
    <div>
      <div class="field-label">sub</div>
      <input class="f-input" value="${esc(step.sub||'')}"
        onchange="updateField('${modId}',${step.id},'sub',this.value)">
    </div>
    <div>
      <div class="field-label">tip</div>
      <input class="f-input" value="${esc(step.tip||'')}"
        onchange="updateField('${modId}',${step.id},'tip',this.value)">
    </div>
  </div>
  <!-- img + scrollY + ttPos -->
  <div class="field-grid">
    <div>
      <div class="field-label">img key</div>
      <input class="f-input" value="${esc(step.img||'')}"
        onchange="updateField('${modId}',${step.id},'img',this.value)">
    </div>
    <div>
      <div class="field-label">scrollY</div>
      <input class="f-input" type="number" value="${step.scrollY||0}"
        onchange="updateField('${modId}',${step.id},'scrollY',+this.value)">
      <div class="field-hint">= hs.y − 80 (min 0)</div>
    </div>
  </div>
  <!-- ttPos + ttTitle + ttText -->
  <div class="field-grid">
    <div>
      <div class="field-label">ttPos</div>
      <select class="f-select" onchange="updateField('${modId}',${step.id},'ttPos',this.value)">
        ${['right','left','top','bottom'].map(p=>`<option ${step.ttPos===p?'selected':''}>${p}</option>`).join('')}
      </select>
    </div>
    <div>
      <div class="field-label">ttTitle <span>*</span>
        <span class="wc-badge ${wc(step.ttTitle||'')<=5?'wc-ok':'wc-err'}" id="wc-ttt-${modId}-${step.id}">
          ${wc(step.ttTitle||'')} từ
        </span>
      </div>
      <input class="f-input ${wc(step.ttTitle||'')>5?'warn':''}" value="${esc(step.ttTitle||'')}"
        onchange="updateField('${modId}',${step.id},'ttTitle',this.value)"
        oninput="updateWC(this,'wc-ttt-${modId}-${step.id}',5)">
    </div>
  </div>
  <div class="field-grid full">
    <div>
      <div class="field-label">ttText <span>*</span>
        <span class="wc-badge ${wc(step.ttText||'')<=15?'wc-ok':'wc-err'}" id="wc-ttt2-${modId}-${step.id}">
          ${wc(step.ttText||'')} từ
        </span>
      </div>
      <input class="f-input ${wc(step.ttText||'')>15?'warn':''}" value="${esc(step.ttText||'')}"
        onchange="updateField('${modId}',${step.id},'ttText',this.value)"
        oninput="updateWC(this,'wc-ttt2-${modId}-${step.id}',15)">
    </div>
  </div>
  <!-- Hotspot -->
  <div class="field-label" style="margin-bottom:6px">Hotspot (390px space)</div>
  <div class="hs-grid" style="margin-bottom:14px">
    ${['x','y','w','h'].map(k=>`
      <label>${k.toUpperCase()}
        <input type="number" value="${(step.hs||{})[k]||0}"
          onchange="updateHs('${modId}',${step.id},'${k}',+this.value)">
      </label>`).join('')}
  </div>
  <!-- Guide items -->
  <div class="field-label" style="margin-bottom:8px">Guide items (≥2)</div>
  <div class="guide-list" id="gl-${modId}-${step.id}">
    ${g.map((item,gi)=>renderGuideEntry(modId,step.id,item,gi)).join('')}
  </div>
  <button class="btn-add-guide" onclick="addGuide('${modId}',${step.id})">+ Thêm guide item</button>
  `;
}

function renderGuideEntry(modId, stepId, item, gi) {
  return `
  <div class="guide-entry" id="ge-${modId}-${stepId}-${gi}">
    <div class="guide-entry-header">
      <span class="guide-entry-num">Item ${gi+1}</span>
      <button class="btn-del-guide" onclick="delGuide('${modId}',${stepId},${gi})">✕</button>
    </div>
    <div style="display:grid;gap:6px">
      <input class="f-input" placeholder="title" value="${esc(item.title||'')}"
        onchange="updateGuide('${modId}',${stepId},${gi},'title',this.value)">
      <textarea class="f-textarea" placeholder="body"
        onchange="updateGuide('${modId}',${stepId},${gi},'body',this.value)">${esc(item.body||'')}</textarea>
      <input class="f-input" placeholder="note (optional)" value="${esc(item.note||'')}"
        onchange="updateGuide('${modId}',${stepId},${gi},'note',this.value)">
    </div>
  </div>`;
}

// ── Field update helpers ──────────────────────────────────────────────
function updateField(modId, stepId, field, value) {
  const step = getStep(modId, stepId);
  if (!step) return;
  step[field] = value;
  DIRTY[modId] = true;
  refreshStepCard(modId, stepId);
}

function updateHs(modId, stepId, key, value) {
  const step = getStep(modId, stepId);
  if (!step) return;
  if (!step.hs) step.hs = {};
  step.hs[key] = value;
  // Auto-compute scrollY
  if (key === 'y') {
    const auto = Math.max(0, value - 80);
    step.scrollY = auto;
  }
  DIRTY[modId] = true;
}

function updateGuide(modId, stepId, gi, field, value) {
  const step = getStep(modId, stepId);
  if (!step || !step.guide[gi]) return;
  step.guide[gi][field] = value;
  DIRTY[modId] = true;
}

function addGuide(modId, stepId) {
  const step = getStep(modId, stepId);
  if (!step) return;
  if (!step.guide) step.guide = [];
  step.guide.push({ title: 'TODO: title', body: 'TODO: body', note: '' });
  DIRTY[modId] = true;
  refreshStepCard(modId, stepId);
}

function delGuide(modId, stepId, gi) {
  const step = getStep(modId, stepId);
  if (!step) return;
  step.guide.splice(gi, 1);
  DIRTY[modId] = true;
  refreshStepCard(modId, stepId);
}

function getStep(modId, stepId) {
  return DATA?.modules?.[modId]?.steps?.find(s => s.id === stepId);
}

function refreshStepCard(modId, stepId) {
  const step = getStep(modId, stepId);
  const el   = document.getElementById(`sc-${modId}-${stepId}`);
  if (!el || !step) return;
  const isOpen  = el.classList.contains('open');
  const hasTodo = JSON.stringify(step).includes('TODO');
  el.className  = `step-card ${hasTodo ? 'has-todo' : ''} ${isOpen ? 'open' : ''}`;
}

// ── Toggle step card ──────────────────────────────────────────────────
function toggleStep(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('open');
}

// ── Word count ────────────────────────────────────────────────────────
function wc(s) { return s.trim() ? s.trim().split(/\s+/).length : 0; }
function updateWC(input, badgeId, limit) {
  const count = wc(input.value);
  const badge = document.getElementById(badgeId);
  if (badge) {
    badge.textContent = `${count} từ`;
    badge.className   = `wc-badge ${count <= limit ? 'wc-ok' : 'wc-err'}`;
  }
  input.className = `f-input ${count > limit ? 'warn' : ''}`;
}

// ── Validate ──────────────────────────────────────────────────────────
function validateModule(modId) {
  const mod    = DATA?.modules?.[modId];
  const banner = document.getElementById('validate-banner');
  if (!mod || !banner) return;
  const errs = [];

  (mod.steps || []).forEach(s => {
    const id = s.id;
    if (wc(s.ttTitle||'') > 5)  errs.push(`Bước ${id}: ttTitle vượt 5 từ`);
    if (wc(s.ttText||'')  > 15) errs.push(`Bước ${id}: ttText vượt 15 từ`);
    if ((s.guide||[]).length < 2) errs.push(`Bước ${id}: guide < 2 items`);
    Object.entries(s).forEach(([k,v]) => {
      if (typeof v === 'string' && v.startsWith('TODO')) errs.push(`Bước ${id}: ${k} còn TODO`);
    });
  });

  banner.style.display = 'block';
  if (errs.length === 0) {
    banner.className   = 'validate-banner ok';
    banner.textContent = `✅ Module "${mod.name}" PASS — ${mod.steps.length} bước, không lỗi`;
  } else {
    banner.className   = 'validate-banner err';
    banner.innerHTML   = `❌ ${errs.length} lỗi:<br>• ` + errs.join('<br>• ');
  }
  banner.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function validateAll() {
  if (!DATA) return;
  let total = 0;
  Object.keys(DATA.modules || {}).forEach(id => {
    const mod = DATA.modules[id];
    (mod.steps||[]).forEach(s => {
      if (JSON.stringify(s).includes('TODO')) total++;
      if (wc(s.ttTitle||'')>5 || wc(s.ttText||'')>15) total++;
    });
  });
  showToast(total === 0 ? '✅ Tất cả modules PASS' : `⚠️ Còn ${total} vấn đề — validate từng module để xem chi tiết`);
}

function checkTodos(modId) {
  const mod  = DATA?.modules?.[modId];
  if (!mod) return;
  const todos = [];
  (mod.steps||[]).forEach(s => {
    Object.entries(s).forEach(([k,v]) => {
      if (typeof v === 'string' && v.startsWith('TODO')) todos.push(`Bước ${s.id}: ${k}`);
    });
  });
  showToast(todos.length ? `📋 ${todos.length} TODO: ${todos.slice(0,4).join(', ')}${todos.length>4?'...':''}` : '✅ Không còn TODO');
}

// ── Preview ───────────────────────────────────────────────────────────
function showPreview() {
  if (!CUR_MOD) { showToast('Chọn module trước'); return; }
  // Save to sessionStorage for preview
  sessionStorage.setItem('preview_data', JSON.stringify(DATA));
  const wrap  = document.getElementById('preview-wrap');
  const frame = document.getElementById('preview-frame');
  document.getElementById('preview-title').textContent = `Preview: ${DATA.modules[CUR_MOD]?.name}`;
  frame.src = `training-engine.html?module=${CUR_MOD}&preview=1`;
  wrap.classList.add('show');
}
function closePreview() {
  document.getElementById('preview-wrap').classList.remove('show');
  document.getElementById('preview-frame').src = '';
}

// ── Export ────────────────────────────────────────────────────────────
function exportJSON() {
  if (!DATA) return;
  DATA.lastUpdated = new Date().toISOString().split('T')[0];
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
  const a    = document.createElement('a');
  a.href     = URL.createObjectURL(blob);
  a.download = 'modules.json';
  a.click();
  showToast('✅ Đã export modules.json');
  DIRTY = {};
}

// ── Toast ─────────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 3000);
}

// ── Utils ─────────────────────────────────────────────────────────────
function esc(s) {
  return String(s).replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Warn on unload if dirty
window.addEventListener('beforeunload', e => {
  if (Object.keys(DIRTY).length > 0) {
    e.preventDefault();
    e.returnValue = 'Có thay đổi chưa export. Bạn có muốn rời trang?';
  }
});
</script>
