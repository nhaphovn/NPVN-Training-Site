<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Nhà Phố Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── CSS Variables ─────────────────────────────────────────────────── */
:root {
  --green:      #00A651;
  --green-dark: #007A3D;
  --green-bg:   #E5EDE5;
  --green-dim:  rgba(0,166,81,.12);
  --white:      #FFFFFF;
  --text:       #1A1A1A;
  --muted:      #666666;
  --border:     #E0E0E0;
  --error:      #E53935;

  /* Phone desktop */
  --ph-w:     270px;
  --sc-w:     254px;
  --sc-h:     560px;
  --notch:    22px;

  --radius:   14px;
  --shadow:   0 4px 24px rgba(0,0,0,.10);
  --font:     'Be Vietnam Pro', sans-serif;
}

/* ── Reset ─────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }
body {
  font-family: var(--font);
  background: var(--green-bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}
button { font-family: var(--font); cursor: pointer; border: none; background: none; }
input, textarea { font-family: var(--font); }
a { color: inherit; text-decoration: none; }

/* ── Loading screen ────────────────────────────────────────────────── */
#loading {
  position: fixed; inset: 0;
  background: var(--green-bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 16px; z-index: 9999;
  transition: opacity .4s;
}
#loading .logo {
  width: 56px; height: 56px; border-radius: 14px;
  background: var(--green);
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
}
#loading .spinner {
  width: 32px; height: 32px;
  border: 3px solid rgba(0,166,81,.2);
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
#loading p { color: var(--muted); font-size: .85rem; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Error screen ──────────────────────────────────────────────────── */
#error-screen {
  display: none; position: fixed; inset: 0;
  background: var(--green-bg);
  align-items: center; justify-content: center;
  flex-direction: column; gap: 12px; z-index: 9998;
}
#error-screen h2 { color: var(--error); }
#error-screen p { color: var(--muted); font-size: .9rem; }

/* ── App shell ─────────────────────────────────────────────────────── */
#app { display: none; flex-direction: column; min-height: 100vh; }

/* ── Top header ────────────────────────────────────────────────────── */
.top-header {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 56px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 1px 8px rgba(0,0,0,.06);
}
.top-header .brand {
  display: flex; align-items: center; gap: 10px;
}
.top-header .brand-icon {
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--green);
  display: flex; align-items: center; justify-content: center;
  color: white; font-size: 16px; font-weight: 700;
}
.top-header .brand-name {
  font-weight: 700; font-size: .95rem; color: var(--green);
}
.top-header .module-info {
  display: flex; align-items: center; gap: 8px;
}
.top-header .module-icon {
  font-size: 1.1rem;
}
.top-header .module-name {
  font-weight: 600; font-size: .9rem;
}
.top-header .module-role {
  font-size: .75rem; color: var(--muted);
  background: var(--green-bg);
  padding: 2px 8px; border-radius: 20px;
}
.top-header .btn-back {
  display: flex; align-items: center; gap: 6px;
  font-size: .85rem; color: var(--muted);
  padding: 6px 10px; border-radius: 8px;
  transition: background .15s;
}
.top-header .btn-back:hover { background: var(--green-bg); }
.top-header .btn-back svg { width: 16px; height: 16px; }

/* ── Progress bar (top) ────────────────────────────────────────────── */
.progress-bar-wrap {
  height: 3px; background: var(--border);
  position: sticky; top: 56px; z-index: 99;
}
.progress-bar-fill {
  height: 100%; background: var(--green);
  transition: width .35s ease;
}

/* ── Main 3-col layout ─────────────────────────────────────────────── */
.main-layout {
  display: grid;
  grid-template-columns: 260px 1fr 340px;
  gap: 0;
  flex: 1;
  max-width: 1280px;
  margin: 0 auto;
  width: 100%;
  min-height: calc(100vh - 59px);
}

/* ── Sidebar steps ─────────────────────────────────────────────────── */
.sidebar {
  background: var(--white);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 20px 0;
}
.sidebar-title {
  font-size: .7rem; font-weight: 700; letter-spacing: .08em;
  color: var(--muted); text-transform: uppercase;
  padding: 0 20px 12px;
}
.step-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 10px 20px;
  cursor: pointer;
  transition: background .15s;
  border-left: 3px solid transparent;
}
.step-item:hover { background: var(--green-bg); }
.step-item.active {
  background: var(--green-dim);
  border-left-color: var(--green);
}
.step-item.done .step-num {
  background: var(--green); color: white;
}
.step-num {
  min-width: 24px; height: 24px; border-radius: 50%;
  background: var(--green-bg); border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: .7rem; font-weight: 700; color: var(--muted);
  margin-top: 1px;
  transition: all .2s;
}
.step-item.active .step-num {
  background: var(--green); color: white; border-color: var(--green);
}
.step-text { flex: 1; }
.step-text .s-name {
  font-size: .82rem; font-weight: 600; line-height: 1.3;
}
.step-text .s-sub {
  font-size: .72rem; color: var(--muted); margin-top: 2px; line-height: 1.3;
}
.step-item.active .s-name { color: var(--green); }

/* ── Center: phone demo ────────────────────────────────────────────── */
.demo-col {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 32px 24px;
  gap: 20px;
  background: var(--green-bg);
  position: relative;
}

/* Step counter pill */
.step-counter {
  font-size: .8rem; font-weight: 600; color: var(--muted);
  background: white; padding: 4px 14px; border-radius: 20px;
  box-shadow: 0 1px 4px rgba(0,0,0,.08);
}
.step-counter span { color: var(--green); }

/* Phone wrapper — positions tooltip outside */
.phone-wrapper {
  position: relative;
  width: var(--ph-w);
}

/* Phone frame */
.phone-frame {
  width: var(--ph-w);
  background: #1A1A1A;
  border-radius: 36px;
  padding: 6px;
  box-shadow:
    0 0 0 1px #333,
    0 20px 60px rgba(0,0,0,.35),
    0 8px 24px rgba(0,0,0,.2);
  position: relative;
  z-index: 2;
}

/* Notch */
.phone-notch {
  height: var(--notch);
  background: #1A1A1A;
  border-radius: 12px 12px 0 0;
  display: flex; align-items: center; justify-content: center;
}
.notch-pill {
  width: 70px; height: 10px;
  background: #111; border-radius: 6px;
}

/* Screen */
.phone-screen {
  width: var(--sc-w);
  height: var(--sc-h);
  background: #f0f0f0;
  border-radius: 4px;
  overflow: hidden;
  position: relative;
  cursor: pointer;
}

/* Screen image */
.screen-img {
  width: 390px; /* original design size */
  height: auto;
  position: absolute;
  top: 0; left: 0;
  transform-origin: top left;
  /* scale set via JS: transform: scale(SCALE) translateY(-scrollY * SCALE) */
  transition: transform .4s cubic-bezier(.4,0,.2,1);
}

/* Dim overlay — 4 rects */
.dim-top, .dim-bottom, .dim-left, .dim-right {
  position: absolute;
  background: rgba(0,0,0,.48);
  pointer-events: none;
  z-index: 3;
  transition: all .35s ease;
}
.dim-top    { top:0; left:0; right:0; }
.dim-bottom { bottom:0; left:0; right:0; }
.dim-left   { top:0; left:0; bottom:0; }
.dim-right  { top:0; right:0; bottom:0; }

/* Hotspot */
.hotspot {
  position: absolute;
  border: 2.5px solid var(--green);
  border-radius: 6px;
  background: rgba(0,166,81,.12);
  z-index: 4;
  transition: all .35s ease;
  cursor: pointer;
}
.hotspot::after {
  content: '';
  position: absolute; inset: -5px;
  border-radius: 10px;
  border: 2px solid var(--green);
  opacity: 0;
  animation: pulse 1.8s ease-out infinite;
}
@keyframes pulse {
  0%   { opacity: .7; transform: scale(1); }
  100% { opacity: 0;  transform: scale(1.25); }
}

/* ── Tooltip — OUTSIDE phone frame ────────────────────────────────── */
.tooltip {
  position: absolute;
  background: var(--white);
  border-radius: 12px;
  padding: 12px 14px;
  box-shadow: 0 4px 20px rgba(0,0,0,.16), 0 0 0 1px rgba(0,166,81,.15);
  width: 180px;
  z-index: 10;
  pointer-events: none;
  opacity: 0;
  transition: opacity .25s, transform .25s;
}
.tooltip.show { opacity: 1; }
.tooltip-title {
  font-size: .78rem; font-weight: 700; color: var(--green);
  margin-bottom: 4px;
}
.tooltip-text {
  font-size: .72rem; color: var(--muted); line-height: 1.45;
}
/* Tooltip arrow */
.tooltip::before {
  content: '';
  position: absolute;
  width: 0; height: 0;
}
/* right → tooltip on right, arrow points left */
.tooltip.pos-right { left: calc(var(--ph-w) + 14px); top: 50%; transform: translateY(-50%); }
.tooltip.pos-right::before {
  left: -7px; top: 50%; transform: translateY(-50%);
  border-top: 7px solid transparent;
  border-bottom: 7px solid transparent;
  border-right: 7px solid white;
}
/* left → tooltip on left */
.tooltip.pos-left { right: calc(var(--ph-w) + 14px); top: 50%; transform: translateY(-50%); }
.tooltip.pos-left::before {
  right: -7px; top: 50%; transform: translateY(-50%);
  border-top: 7px solid transparent;
  border-bottom: 7px solid transparent;
  border-left: 7px solid white;
}
/* top → tooltip above phone */
.tooltip.pos-top { bottom: calc(100% + 14px); left: 50%; transform: translateX(-50%); }
.tooltip.pos-top::before {
  bottom: -7px; left: 50%; transform: translateX(-50%);
  border-left: 7px solid transparent;
  border-right: 7px solid transparent;
  border-top: 7px solid white;
}
/* bottom → tooltip below phone */
.tooltip.pos-bottom { top: calc(100% + 14px); left: 50%; transform: translateX(-50%); }
.tooltip.pos-bottom::before {
  top: -7px; left: 50%; transform: translateX(-50%);
  border-left: 7px solid transparent;
  border-right: 7px solid transparent;
  border-bottom: 7px solid white;
}

/* Nav buttons below phone */
.phone-nav {
  display: flex; gap: 12px; align-items: center;
}
.btn-nav {
  display: flex; align-items: center; gap: 6px;
  padding: 9px 18px; border-radius: 10px;
  font-size: .83rem; font-weight: 600;
  transition: all .15s;
}
.btn-prev {
  background: white; color: var(--muted);
  box-shadow: 0 1px 4px rgba(0,0,0,.08);
}
.btn-prev:hover { background: #f5f5f5; }
.btn-prev:disabled { opacity: .35; cursor: not-allowed; }
.btn-next {
  background: var(--green); color: white;
  box-shadow: 0 2px 8px rgba(0,166,81,.35);
}
.btn-next:hover { background: var(--green-dark); }
.btn-next:disabled { opacity: .35; cursor: not-allowed; }
.btn-nav svg { width: 16px; height: 16px; }

/* ── Right panel: Guide + Chat ─────────────────────────────────────── */
.right-panel {
  background: var(--white);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
}

/* Panel tabs */
.panel-tabs {
  display: flex; border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.panel-tab {
  flex: 1; padding: 14px;
  font-size: .82rem; font-weight: 600; color: var(--muted);
  border-bottom: 2.5px solid transparent;
  transition: all .15s;
  cursor: pointer;
  text-align: center;
}
.panel-tab.active { color: var(--green); border-bottom-color: var(--green); }

/* Guide panel */
#panel-guide {
  flex: 1; overflow-y: auto; padding: 20px;
}
.guide-step-title {
  font-size: 1rem; font-weight: 700; margin-bottom: 4px; line-height: 1.3;
}
.guide-step-sub {
  font-size: .82rem; color: var(--muted); margin-bottom: 16px; line-height: 1.4;
}
.guide-tip {
  background: var(--green-dim);
  border-left: 3px solid var(--green);
  border-radius: 0 8px 8px 0;
  padding: 8px 12px;
  font-size: .78rem; color: var(--green-dark);
  margin-bottom: 16px;
}
.guide-item {
  margin-bottom: 14px;
  padding: 12px 14px;
  background: #fafafa;
  border-radius: 10px;
  border: 1px solid var(--border);
}
.guide-item-title {
  font-size: .82rem; font-weight: 700; margin-bottom: 4px;
  display: flex; align-items: center; gap: 6px;
}
.guide-item-title::before {
  content: '';
  display: inline-block;
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--green); flex-shrink: 0;
}
.guide-item-body {
  font-size: .78rem; color: #444; line-height: 1.55;
}
.guide-item-note {
  margin-top: 5px;
  font-size: .72rem; color: var(--muted);
  font-style: italic;
}

/* Chat panel */
#panel-chat { flex: 1; display: none; flex-direction: column; overflow: hidden; }
#panel-chat.active { display: flex; }

.api-key-bar {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  display: flex; gap: 8px; align-items: center;
  flex-shrink: 0;
}
.api-key-bar input {
  flex: 1; padding: 6px 10px;
  border: 1px solid var(--border); border-radius: 7px;
  font-size: .75rem; color: var(--text);
  outline: none;
}
.api-key-bar input:focus { border-color: var(--green); }
.api-key-bar input::placeholder { color: #bbb; }
.btn-save-key {
  padding: 6px 12px; border-radius: 7px;
  background: var(--green); color: white;
  font-size: .73rem; font-weight: 600;
  white-space: nowrap;
}
.btn-save-key:hover { background: var(--green-dark); }

.chat-messages {
  flex: 1; overflow-y: auto;
  padding: 14px;
  display: flex; flex-direction: column; gap: 10px;
}
.msg {
  max-width: 88%; display: flex; flex-direction: column; gap: 3px;
}
.msg.user { align-self: flex-end; align-items: flex-end; }
.msg.bot  { align-self: flex-start; align-items: flex-start; }
.msg-bubble {
  padding: 9px 13px;
  border-radius: 14px;
  font-size: .8rem; line-height: 1.5;
}
.msg.user .msg-bubble { background: var(--green); color: white; border-radius: 14px 14px 4px 14px; }
.msg.bot  .msg-bubble { background: #f3f3f3; color: var(--text); border-radius: 14px 14px 14px 4px; }
.msg-bubble.thinking { color: var(--muted); font-style: italic; }

.chat-input-row {
  padding: 10px 14px;
  border-top: 1px solid var(--border);
  display: flex; gap: 8px; align-items: flex-end;
  flex-shrink: 0;
}
.chat-input-row textarea {
  flex: 1; padding: 8px 12px;
  border: 1px solid var(--border); border-radius: 10px;
  font-size: .8rem; resize: none; outline: none;
  max-height: 80px; line-height: 1.45;
}
.chat-input-row textarea:focus { border-color: var(--green); }
.btn-send {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--green); color: white;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background .15s;
}
.btn-send:hover { background: var(--green-dark); }
.btn-send:disabled { opacity: .4; cursor: not-allowed; }
.btn-send svg { width: 16px; height: 16px; }

/* ── TABLET 768-1023 ───────────────────────────────────────────────── */
@media (max-width: 1023px) {
  .main-layout {
    grid-template-columns: 1fr 320px;
    max-width: 100%;
  }
  .sidebar { display: none; }

  /* Progress pills instead of sidebar */
  .mobile-pills {
    display: flex;
    overflow-x: auto;
    gap: 8px;
    padding: 10px 16px;
    background: white;
    border-bottom: 1px solid var(--border);
    scrollbar-width: none;
    flex-shrink: 0;
  }
  .mobile-pills::-webkit-scrollbar { display: none; }
  .pill {
    flex-shrink: 0;
    padding: 5px 12px; border-radius: 20px;
    font-size: .73rem; font-weight: 600;
    background: var(--green-bg); color: var(--muted);
    cursor: pointer; transition: all .15s;
    white-space: nowrap;
  }
  .pill.active { background: var(--green); color: white; }
  .pill.done   { background: rgba(0,166,81,.15); color: var(--green); }
}

/* ── MOBILE <768 ───────────────────────────────────────────────────── */
@media (max-width: 767px) {
  :root {
    --ph-w:  230px;
    --sc-w:  216px;
    --sc-h:  480px;
    --notch: 18px;
  }

  .main-layout {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr;
  }
  .right-panel {
    border-left: none;
    border-top: 1px solid var(--border);
    max-height: 380px;
  }

  /* Tooltip forced to bottom on mobile */
  .tooltip.pos-right,
  .tooltip.pos-left {
    position: absolute !important;
    right: auto !important;
    left: 50% !important;
    top: calc(100% + 10px) !important;
    transform: translateX(-50%) !important;
    width: 200px;
  }
  .tooltip.pos-right::before,
  .tooltip.pos-left::before {
    left: 50% !important; right: auto !important;
    top: -7px !important;
    transform: translateX(-50%) !important;
    border-left: 7px solid transparent !important;
    border-right: 7px solid transparent !important;
    border-bottom: 7px solid white !important;
    border-top: none !important;
  }

  /* FAB chat button */
  .fab-chat {
    display: flex;
    position: fixed; bottom: 80px; right: 20px;
    width: 48px; height: 48px;
    background: var(--green); color: white;
    border-radius: 50%;
    align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(0,166,81,.4);
    z-index: 200;
    font-size: 20px;
  }

  /* Fixed bottom nav */
  .mobile-bottom-nav {
    display: flex !important;
    position: fixed; bottom: 0; left: 0; right: 0;
    background: white; border-top: 1px solid var(--border);
    padding: 10px 20px 18px; gap: 12px;
    z-index: 150;
  }
  .mobile-bottom-nav .btn-nav { flex: 1; justify-content: center; }

  /* Push content above fixed nav */
  #app { padding-bottom: 72px; }
  .demo-col { padding: 16px 12px; }

  /* Hide desktop nav */
  .phone-nav { display: none; }

  /* Panel height on mobile */
  .right-panel { max-height: 320px; }
}

/* ── Hide mobile-only on desktop ───────────────────────────────────── */
.mobile-pills { display: none; }
.fab-chat { display: none; }
.mobile-bottom-nav { display: none; }

/* ── Scrollbar ─────────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #ccc; border-radius: 99px; }

/* ── Transitions ───────────────────────────────────────────────────── */
.guide-step-title, .guide-step-sub, .guide-tip,
.guide-item, .step-counter {
  transition: opacity .25s;
}
.fade-out { opacity: 0 !important; }
</style>
</head>
<body>

<!-- Loading -->
<div id="loading">
  <div class="logo">🏠</div>
  <div class="spinner"></div>
  <p>Đang tải module...</p>
</div>

<!-- Error -->
<div id="error-screen">
  <h2>⚠️ Không tải được module</h2>
  <p id="error-msg">Kiểm tra URL param ?module=... và file data/modules.json</p>
  <a href="index.html" style="color:var(--green);margin-top:8px;font-size:.85rem;">← Về trang chủ</a>
</div>

<!-- App -->
<div id="app">

  <!-- Header -->
  <header class="top-header">
    <div class="brand">
      <a href="index.html" class="btn-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
        Trang chủ
      </a>
    </div>
    <div class="module-info">
      <span class="module-icon" id="hdr-icon"></span>
      <span class="module-name" id="hdr-name"></span>
      <span class="module-role" id="hdr-role"></span>
    </div>
    <div style="width:90px"></div><!-- spacer -->
  </header>

  <!-- Progress bar -->
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
  </div>

  <!-- Mobile pills (tablet/mobile) -->
  <div class="mobile-pills" id="mobile-pills"></div>

  <!-- Main layout -->
  <div class="main-layout">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-title">Các bước</div>
      <div id="step-list"></div>
    </aside>

    <!-- Demo column -->
    <main class="demo-col">
      <div class="step-counter">Bước <span id="cur-step">1</span> / <span id="tot-steps">1</span></div>

      <!-- Phone wrapper (tooltip positioned relative to this) -->
      <div class="phone-wrapper" id="phone-wrapper">

        <!-- Tooltip -->
        <div class="tooltip" id="tooltip">
          <div class="tooltip-title" id="tt-title"></div>
          <div class="tooltip-text"  id="tt-text"></div>
        </div>

        <!-- Phone frame -->
        <div class="phone-frame">
          <div class="phone-notch"><div class="notch-pill"></div></div>
          <div class="phone-screen" id="phone-screen">
            <img class="screen-img" id="screen-img" src="" alt="App screen" draggable="false">
            <!-- Dim rects -->
            <div class="dim-top"    id="dim-top"></div>
            <div class="dim-bottom" id="dim-bottom"></div>
            <div class="dim-left"   id="dim-left"></div>
            <div class="dim-right"  id="dim-right"></div>
            <!-- Hotspot -->
            <div class="hotspot" id="hotspot"></div>
          </div>
        </div>
      </div><!-- /phone-wrapper -->

      <!-- Desktop nav buttons -->
      <div class="phone-nav">
        <button class="btn-nav btn-prev" id="btn-prev" onclick="navigate(-1)" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
          Trước
        </button>
        <button class="btn-nav btn-next" id="btn-next" onclick="navigate(1)">
          Tiếp
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </button>
      </div>
    </main>

    <!-- Right panel -->
    <aside class="right-panel">
      <div class="panel-tabs">
        <div class="panel-tab active" id="tab-guide" onclick="switchTab('guide')">📖 Hướng dẫn</div>
        <div class="panel-tab"        id="tab-chat"  onclick="switchTab('chat')">💬 Hỏi AI</div>
      </div>

      <!-- Guide -->
      <div id="panel-guide">
        <div class="guide-step-title" id="g-title"></div>
        <div class="guide-step-sub"   id="g-sub"></div>
        <div class="guide-tip"        id="g-tip" style="display:none"></div>
        <div id="g-items"></div>
      </div>

      <!-- Chat -->
      <div id="panel-chat">
        <div class="api-key-bar">
          <input type="password" id="api-key-input" placeholder="Nhập Claude API key...">
          <button class="btn-save-key" onclick="saveKey()">Lưu</button>
        </div>
        <div class="chat-messages" id="chat-messages">
          <div class="msg bot">
            <div class="msg-bubble" id="chat-welcome"></div>
          </div>
        </div>
        <div class="chat-input-row">
          <textarea id="chat-input" rows="1" placeholder="Hỏi về bước này..." onkeydown="chatKeydown(event)"></textarea>
          <button class="btn-send" id="btn-send" onclick="sendChat()">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
          </button>
        </div>
      </div>
    </aside>

  </div><!-- /main-layout -->

  <!-- FAB chat (mobile) -->
  <button class="fab-chat" onclick="switchTab('chat')" title="Hỏi AI">💬</button>

  <!-- Mobile bottom nav -->
  <div class="mobile-bottom-nav">
    <button class="btn-nav btn-prev" onclick="navigate(-1)" id="m-btn-prev" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
      Trước
    </button>
    <button class="btn-nav btn-next" onclick="navigate(1)"  id="m-btn-next">
      Tiếp
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </button>
  </div>

</div><!-- /app -->

<script>
/* ═══════════════════════════════════════════════════════════════════
   training-engine.js — Nhà Phố Training Site
   Đọc ?module=xxx → fetch modules.json → render
   ═══════════════════════════════════════════════════════════════════ */

// ── State ────────────────────────────────────────────────────────────
let MODULE   = null;   // module object từ JSON
let STEPS    = [];     // array of steps
let CUR      = 0;      // current step index (0-based)
let IMAGES   = {};     // { key: dataURL or path }
let API_KEY  = '';
let CHAT_SYS = '';
let CHAT_HIST = [];    // [{role, content}]

// ── Boot ─────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  const params   = new URLSearchParams(location.search);
  const moduleId = params.get('module') || '';

  if (!moduleId) { showError('Thiếu ?module= trong URL. Ví dụ: ?module=dang_tin'); return; }

  try {
    const res  = await fetch('data/modules.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    MODULE = data.modules?.[moduleId];
    if (!MODULE) throw new Error(`Module "${moduleId}" không tồn tại trong modules.json`);

    STEPS  = MODULE.steps || [];
    IMAGES = MODULE.images || {};

    // Validate
    if (STEPS.length === 0) throw new Error('Module không có bước nào');

    // Build chatbot system prompt
    const brand = data.brand || {};
    CHAT_SYS = buildSysPrompt(MODULE, brand);

    // Restore saved key
    API_KEY = localStorage.getItem('np_api_key') || '';
    if (API_KEY) {
      document.getElementById('api-key-input').value = '••••••••';
    }

    // Render
    renderHeader(data.brand);
    renderSidebar();
    renderMobilePills();
    renderStep(0);

    // Show app
    document.getElementById('loading').style.opacity = '0';
    setTimeout(() => { document.getElementById('loading').style.display = 'none'; }, 400);
    const app = document.getElementById('app');
    app.style.display = 'flex';

    // Set welcome message
    document.getElementById('chat-welcome').textContent =
      `Xin chào! Tôi là trợ lý hướng dẫn module "${MODULE.name}". Bạn cần hỏi gì về bước này?`;

  } catch (e) {
    showError(e.message);
  }
});

// ── Header ───────────────────────────────────────────────────────────
function renderHeader(brand) {
  document.getElementById('hdr-icon').textContent = MODULE.icon || '📱';
  document.getElementById('hdr-name').textContent = MODULE.name || '';
  document.getElementById('hdr-role').textContent = MODULE.role || '';
  document.title = `${MODULE.name} — Nhà Phố Training`;
}

// ── Sidebar ──────────────────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('step-list');
  list.innerHTML = STEPS.map((s, i) => `
    <div class="step-item" id="si-${i}" onclick="navigate(${i} - CUR)">
      <div class="step-num">${i + 1}</div>
      <div class="step-text">
        <div class="s-name">${s.name || `Bước ${i+1}`}</div>
        ${s.sub ? `<div class="s-sub">${s.sub}</div>` : ''}
      </div>
    </div>
  `).join('');
}

// ── Mobile pills ─────────────────────────────────────────────────────
function renderMobilePills() {
  const wrap = document.getElementById('mobile-pills');
  wrap.innerHTML = STEPS.map((s, i) => `
    <div class="pill" id="pill-${i}" onclick="navigate(${i} - CUR)">${i+1}. ${s.name || `Bước ${i+1}`}</div>
  `).join('');
}

// ── Step renderer ─────────────────────────────────────────────────────
function renderStep(idx) {
  const step   = STEPS[idx];
  const total  = STEPS.length;
  const scaleX = getScale();

  // Counter + progress
  document.getElementById('cur-step').textContent   = idx + 1;
  document.getElementById('tot-steps').textContent  = total;
  document.getElementById('progress-fill').style.width = `${((idx + 1) / total) * 100}%`;

  // Sidebar active
  document.querySelectorAll('.step-item').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
    el.classList.toggle('done',   i < idx);
  });
  // Mobile pills
  document.querySelectorAll('.pill').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
    el.classList.toggle('done',   i < idx);
  });
  // Scroll pill into view
  const activePill = document.getElementById(`pill-${idx}`);
  if (activePill) activePill.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });

  // Image
  const imgKey = step.img || 'home';
  const imgSrc = IMAGES[imgKey] || '';
  const imgEl  = document.getElementById('screen-img');
  imgEl.src    = imgSrc;

  // Scroll + scale
  const scrollY = Math.max(0, step.scrollY || 0);
  imgEl.style.transform = `scale(${scaleX}) translateY(${-scrollY}px)`;
  imgEl.style.transformOrigin = 'top left';

  // Hotspot
  renderHotspot(step, scaleX);

  // Tooltip
  renderTooltip(step);

  // Guide panel
  renderGuide(step);

  // Nav buttons
  document.getElementById('btn-prev').disabled   = idx === 0;
  document.getElementById('btn-next').disabled   = idx === total - 1;
  document.getElementById('m-btn-prev').disabled = idx === 0;
  document.getElementById('m-btn-next').disabled = idx === total - 1;
  document.getElementById('btn-next').textContent = idx === total - 1 ? '🎉 Hoàn thành' : '';
  renderNavBtn(idx, total);
}

function renderNavBtn(idx, total) {
  const btnNext  = document.getElementById('btn-next');
  const mBtnNext = document.getElementById('m-btn-next');
  const isLast   = idx === total - 1;
  const nextHTML = isLast
    ? `🎉 Hoàn thành`
    : `Tiếp <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><path d="M9 18l6-6-6-6"/></svg>`;
  btnNext.innerHTML  = nextHTML;
  mBtnNext.innerHTML = nextHTML;
}

// ── Scale calculation ─────────────────────────────────────────────────
function getScale() {
  const scW = parseFloat(getComputedStyle(document.documentElement)
    .getPropertyValue('--sc-w')) || 254;
  return scW / 390;
}

// ── Hotspot ───────────────────────────────────────────────────────────
function renderHotspot(step, scale) {
  const hs     = step.hs || {};
  const hotspot = document.getElementById('hotspot');
  const scH    = document.getElementById('phone-screen').offsetHeight;
  const scrollY = Math.max(0, step.scrollY || 0);

  const x = (hs.x || 0) * scale;
  const y = ((hs.y || 0) - scrollY) * scale;
  const w = (hs.w || 40) * scale;
  const h = (hs.h || 40) * scale;

  hotspot.style.left   = `${x}px`;
  hotspot.style.top    = `${y}px`;
  hotspot.style.width  = `${w}px`;
  hotspot.style.height = `${h}px`;
  hotspot.style.display = (hs.x !== undefined) ? 'block' : 'none';

  // Dim rects
  const sw = document.getElementById('phone-screen').offsetWidth;
  const sh = scH;
  document.getElementById('dim-top').style.height    = `${Math.max(0,y)}px`;
  document.getElementById('dim-bottom').style.height = `${Math.max(0, sh - y - h)}px`;
  document.getElementById('dim-left').style.cssText  =
    `top:${y}px; height:${h}px; width:${Math.max(0,x)}px;`;
  document.getElementById('dim-right').style.cssText =
    `top:${y}px; height:${h}px; width:${Math.max(0, sw - x - w)}px;`;
}

// ── Tooltip ───────────────────────────────────────────────────────────
function renderTooltip(step) {
  const tt   = document.getElementById('tooltip');
  const isMobile = window.innerWidth < 768;

  // Clear old position classes
  tt.className = 'tooltip';

  // Determine position
  let pos = step.ttPos || 'right';
  if (isMobile && (pos === 'right' || pos === 'left')) pos = 'bottom';

  tt.classList.add(`pos-${pos}`);

  document.getElementById('tt-title').textContent = step.ttTitle || '';
  document.getElementById('tt-text').textContent  = step.ttText  || '';

  // Reposition tooltip vertically for left/right based on hotspot center
  if ((pos === 'right' || pos === 'left') && step.hs) {
    const scale   = getScale();
    const scrollY = Math.max(0, step.scrollY || 0);
    const hsY     = step.hs.y || 0;
    const hsCY    = ((hsY - scrollY) + (step.hs.h || 40) / 2) * scale;
    const phH     = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sc-h')) + 22 + 12;

    // Clamp to phone wrapper
    const offset  = Math.min(Math.max(hsCY, 30), phH - 30);
    tt.style.top  = `${offset}px`;
    tt.style.transform = 'translateY(-50%)';
  } else {
    tt.style.top  = '';
    tt.style.transform = '';
  }

  // Show with slight delay for transition
  setTimeout(() => tt.classList.add('show'), 50);
}

// ── Guide panel ───────────────────────────────────────────────────────
function renderGuide(step) {
  document.getElementById('g-title').textContent = step.title || step.name || '';
  document.getElementById('g-sub').textContent   = step.sub   || '';

  const tipEl = document.getElementById('g-tip');
  if (step.tip) {
    tipEl.textContent  = '💡 ' + step.tip;
    tipEl.style.display = 'block';
  } else {
    tipEl.style.display = 'none';
  }

  const items = step.guide || [];
  document.getElementById('g-items').innerHTML = items.map(item => `
    <div class="guide-item">
      <div class="guide-item-title">${item.title || ''}</div>
      <div class="guide-item-body">${item.body || ''}</div>
      ${item.note ? `<div class="guide-item-note">* ${item.note}</div>` : ''}
    </div>
  `).join('');
}

// ── Navigation ────────────────────────────────────────────────────────
function navigate(delta) {
  // delta can be absolute index offset OR target index (when called from sidebar)
  const newIdx = CUR + delta;
  if (newIdx < 0 || newIdx >= STEPS.length) return;

  // Hide tooltip during transition
  document.getElementById('tooltip').classList.remove('show');

  CUR = newIdx;
  renderStep(CUR);

  // Scroll guide panel to top
  document.getElementById('panel-guide').scrollTop = 0;
}

// ── Tab switching ─────────────────────────────────────────────────────
function switchTab(tab) {
  const guideEl = document.getElementById('panel-guide');
  const chatEl  = document.getElementById('panel-chat');
  const tabG    = document.getElementById('tab-guide');
  const tabC    = document.getElementById('tab-chat');

  if (tab === 'guide') {
    guideEl.style.display = 'block';
    chatEl.classList.remove('active');
    tabG.classList.add('active');
    tabC.classList.remove('active');
  } else {
    guideEl.style.display = 'none';
    chatEl.classList.add('active');
    tabG.classList.remove('active');
    tabC.classList.add('active');
    // Focus input
    document.getElementById('chat-input').focus();
  }
}

// ── API Key ───────────────────────────────────────────────────────────
function saveKey() {
  const val = document.getElementById('api-key-input').value.trim();
  if (!val || val === '••••••••') return;
  API_KEY = val;
  localStorage.setItem('np_api_key', val);
  document.getElementById('api-key-input').value = '••••••••';
  appendMsg('bot', '✅ API key đã lưu. Bạn có thể đặt câu hỏi ngay!');
}

// ── Chat ─────────────────────────────────────────────────────────────
function chatKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendChat();
  }
}

async function sendChat() {
  const inp  = document.getElementById('chat-input');
  const text = inp.value.trim();
  if (!text) return;
  if (!API_KEY) {
    appendMsg('bot', '⚠️ Vui lòng nhập API key trước. Lấy key tại: console.anthropic.com');
    return;
  }

  inp.value = '';
  inp.style.height = 'auto';
  document.getElementById('btn-send').disabled = true;

  appendMsg('user', text);
  const thinkingId = appendMsg('bot', '...', true);

  // Build messages with context of current step
  const stepCtx = STEPS[CUR];
  const userMsg = `[Đang ở Bước ${CUR+1}: ${stepCtx.title || stepCtx.name}]\n\n${text}`;

  CHAT_HIST.push({ role: 'user', content: userMsg });

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type':      'application/json',
        'x-api-key':         API_KEY,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model:      'claude-sonnet-4-20250514',
        max_tokens: 600,
        system:     CHAT_SYS,
        messages:   CHAT_HIST,
      }),
    });

    const data = await res.json();
    if (data.error) throw new Error(data.error.message);

    const reply = data.content?.[0]?.text || '(Không có phản hồi)';
    updateMsg(thinkingId, reply);
    CHAT_HIST.push({ role: 'assistant', content: reply });

    // Trim history to last 10 turns
    if (CHAT_HIST.length > 20) CHAT_HIST = CHAT_HIST.slice(-20);

  } catch (e) {
    updateMsg(thinkingId, `❌ Lỗi: ${e.message}`);
  }

  document.getElementById('btn-send').disabled = false;
  document.getElementById('chat-input').focus();
}

let msgCounter = 0;
function appendMsg(role, text, thinking = false) {
  const id   = `msg-${++msgCounter}`;
  const wrap = document.getElementById('chat-messages');
  wrap.insertAdjacentHTML('beforeend', `
    <div class="msg ${role}" id="${id}">
      <div class="msg-bubble ${thinking ? 'thinking' : ''}">${escHtml(text)}</div>
    </div>
  `);
  wrap.scrollTop = wrap.scrollHeight;
  return id;
}

function updateMsg(id, text) {
  const el = document.querySelector(`#${id} .msg-bubble`);
  if (el) {
    el.classList.remove('thinking');
    el.textContent = text;
    document.getElementById('chat-messages').scrollTop = 9999;
  }
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          .replace(/\n/g,'<br>');
}

// ── System prompt builder ─────────────────────────────────────────────
function buildSysPrompt(mod, brand) {
  const stepList = (mod.steps || [])
    .map(s => `  Bước ${s.id}: ${s.name} — ${s.sub || ''}`)
    .join('\n');

  return `Bạn là trợ lý AI cho hệ thống đào tạo App ${brand.app || 'Nhà Phố'}.
Nhiệm vụ: Hỗ trợ học viên hiểu và thực hành module "${mod.name}".

ROLE HỌC VIÊN: ${mod.role || 'Nhân viên'}
MODULE: ${mod.name}
${mod.description ? 'MÔ TẢ: ' + mod.description : ''}

CÁC BƯỚC MODULE:
${stepList}

QUY TẮC TRẢ LỜI:
- Ngắn gọn, thực tế, dùng động từ hành động
- Trả lời tập trung vào bước đang hỏi
- Nếu không liên quan module → nhắc lại phạm vi hỗ trợ
- Không dùng "Xin vui lòng", "Hãy thử", "Lưu ý rằng"
- Hotline hỗ trợ: ${brand.hotline || '1900 0266'}`;
}

// ── Error screen ──────────────────────────────────────────────────────
function showError(msg) {
  document.getElementById('loading').style.display = 'none';
  const err = document.getElementById('error-screen');
  document.getElementById('error-msg').textContent = msg;
  err.style.display = 'flex';
}

// ── Resize handler ────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  if (STEPS.length && CUR >= 0) {
    renderHotspot(STEPS[CUR], getScale());
    renderTooltip(STEPS[CUR]);
  }
});
</script>
</body>
</html>
