<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2300A651'/%3E%3Ctext x='50' y='68' font-size='60' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3EN%3C/text%3E%3C/svg%3E">
<title>Nhà Phố Training — Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   NHÀ PHỐ TRAINING ENGINE — v1.0
   Đọc data/modules.json, render module động theo ?module=xxx
   ============================================================ */

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --green: #00A651;
  --green-dark: #007A3D;
  --green-soft: #E5EDE5;
  --green-light: #F0F7F0;
  --text: #1a1a1a;
  --text-2: #555;
  --text-3: #888;
  --border: #e5e5e5;
  --bg: #f7f9f7;
  --white: #fff;
  --warn: #f59e0b;
  --warn-bg: #fef3c7;
  --shadow-sm: 0 2px 8px rgba(0,0,0,.06);
  --shadow-md: 0 4px 16px rgba(0,0,0,.1);
  --shadow-lg: 0 12px 40px rgba(0,0,0,.18);
  /* Phone scale */
  --phone-w: 270px;
  --screen-w: 254px;
  --screen-h: 560px;
  --scale: 0.6513; /* = 254/390 */
}
html, body {
  font-family: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
  color: var(--text);
  background: var(--bg);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea { font-family: inherit; font-size: inherit; }

/* ============================================================
   LOADING / ERROR / PICKER STATES
   ============================================================ */
.state-screen {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  background: var(--bg); z-index: 100; padding: 24px;
}
/* Override class display khi attribute hidden được set */
.state-screen[hidden] { display: none; }
.state-card {
  background: var(--white); border-radius: 16px; padding: 32px; max-width: 480px; width: 100%;
  box-shadow: var(--shadow-md); text-align: center;
}
.state-card .icon { font-size: 56px; margin-bottom: 12px; }
.state-card h2 { font-size: 22px; margin-bottom: 8px; }
.state-card p { color: var(--text-2); margin-bottom: 16px; }
.state-card .err-detail { background: #fee; color: #c00; padding: 10px; border-radius: 8px;
  font-family: monospace; font-size: 12px; text-align: left; margin: 12px 0; word-break: break-all; }
.spinner {
  width: 40px; height: 40px; margin: 0 auto 16px;
  border: 3px solid var(--green-soft); border-top-color: var(--green);
  border-radius: 50%; animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Module picker (khi không có ?module=xxx) */
.picker-list { display: grid; gap: 12px; margin-top: 16px; }
.picker-item {
  display: flex; align-items: center; gap: 12px; padding: 14px;
  border: 2px solid var(--border); border-radius: 12px;
  background: var(--white); text-align: left; transition: all .2s; width: 100%;
}
.picker-item:hover { border-color: var(--green); background: var(--green-light); transform: translateY(-2px); }
.picker-item .pi-icon { font-size: 28px; }
.picker-item .pi-info { flex: 1; min-width: 0; }
.picker-item .pi-name { font-weight: 600; }
.picker-item .pi-desc { font-size: 13px; color: var(--text-2); }
.picker-item .pi-arrow { color: var(--green); font-weight: 700; }

/* ============================================================
   APP LAYOUT — DESKTOP 3-COL
   ============================================================ */
.app { display: none; min-height: 100vh; }
.app.active { display: block; }

header.top-bar {
  position: sticky; top: 0; z-index: 50;
  background: var(--white); border-bottom: 1px solid var(--border);
  padding: 10px 20px; display: flex; align-items: center; gap: 16px;
}
.logo {
  display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--green);
  font-size: 15px; white-space: nowrap;
}
.logo-dot {
  width: 28px; height: 28px; background: var(--green); color: var(--white);
  border-radius: 8px; display: grid; place-items: center; font-size: 14px;
}
.module-title { font-size: 15px; font-weight: 600; flex: 1; min-width: 0; }
.module-title small { display: block; font-size: 11px; color: var(--text-3); font-weight: 400; }
.progress-pill {
  display: flex; align-items: center; gap: 8px;
  background: var(--green-soft); padding: 6px 12px; border-radius: 20px;
  font-size: 13px; font-weight: 600; color: var(--green-dark); white-space: nowrap;
}
.progress-bar {
  width: 60px; height: 6px; background: var(--white); border-radius: 3px; overflow: hidden;
}
.progress-bar > span {
  display: block; height: 100%; background: var(--green); border-radius: 3px; transition: width .4s;
}
.btn-back {
  display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px;
  border-radius: 8px; font-size: 13px; color: var(--text-2);
}
.btn-back:hover { background: var(--green-soft); color: var(--green); }

main.grid {
  display: grid; grid-template-columns: 280px 1fr 380px; gap: 20px;
  max-width: 1400px; margin: 0 auto; padding: 20px;
  align-items: start;
}
/* Grid items mặc định có min-width: auto → bị grow theo content (mobile-pills nhiều).
   Force min-width: 0 để clamp về cột grid. */
main.grid > * { min-width: 0; }

/* ----- SIDEBAR (steps list) ----- */
aside.sidebar {
  background: var(--white); border-radius: 14px; padding: 16px;
  position: sticky; top: 70px; max-height: calc(100vh - 90px); overflow-y: auto;
  box-shadow: var(--shadow-sm);
}
.sidebar h3 { font-size: 13px; color: var(--text-3); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px; }
.step-list { display: flex; flex-direction: column; gap: 4px; }
.step-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  border-radius: 8px; transition: all .15s; text-align: left; width: 100%;
  border-left: 3px solid transparent;
}
.step-item:hover { background: var(--green-light); }
.step-item.active {
  background: var(--green-soft); border-left-color: var(--green); font-weight: 600;
}
.step-item.done .step-num { background: var(--green); color: var(--white); }
.step-num {
  width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  background: var(--bg); font-size: 12px; font-weight: 700; flex-shrink: 0;
  border: 1.5px solid var(--border);
}
.step-item.active .step-num { background: var(--green); color: var(--white); border-color: var(--green); }
.step-info { flex: 1; min-width: 0; }
.step-info .si-name { font-size: 13px; line-height: 1.3; }
.step-info .si-desc { font-size: 11px; color: var(--text-3); margin-top: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ----- PHONE DEMO ----- */
.demo-wrap {
  display: flex; flex-direction: column; align-items: center;
  background: var(--white); border-radius: 14px; padding: 20px;
  box-shadow: var(--shadow-sm);
  position: sticky; top: 70px;
}
.phone-container {
  position: relative;
  width: var(--phone-w); /* + tooltip space sẽ overflow visible */
}
.phone-frame {
  width: var(--phone-w); height: 580px;
  background: #1a1a1a; border-radius: 36px; padding: 8px;
  box-shadow: 0 12px 40px rgba(0,0,0,.2);
  position: relative;
}
.phone-notch {
  position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
  width: 100px; height: 22px; background: #000; border-radius: 0 0 14px 14px; z-index: 5;
}
.phone-screen {
  width: var(--screen-w); height: var(--screen-h);
  background: var(--white); border-radius: 28px; overflow: hidden;
  position: relative;
}
.phone-screen img.bg {
  width: var(--screen-w); display: block; position: absolute; top: 0; left: 0;
  transition: top .3s ease;
  user-select: none; pointer-events: none;
  -webkit-user-drag: none;
}
.dim-overlay {
  position: absolute; inset: 0; background: rgba(0,0,0,.48);
  pointer-events: none; transition: opacity .3s;
}
.hotspot {
  position: absolute; border: 2.5px solid var(--green); border-radius: 8px;
  box-shadow: 0 0 0 4px rgba(0,166,81,.25), 0 0 20px rgba(0,166,81,.6);
  pointer-events: none;
  animation: pulse 1.8s ease-in-out infinite;
  z-index: 3;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 4px rgba(0,166,81,.25), 0 0 20px rgba(0,166,81,.6); }
  50%      { box-shadow: 0 0 0 8px rgba(0,166,81,.15), 0 0 30px rgba(0,166,81,.8); }
}
/* Tooltip — NGOÀI phone frame */
.tooltip {
  position: absolute; z-index: 20;
  background: var(--white); border: 2px solid var(--green); border-radius: 10px;
  padding: 10px 12px; min-width: 160px; max-width: 220px;
  box-shadow: var(--shadow-md);
  font-size: 12px;
}
.tooltip .tt-title { font-weight: 700; color: var(--green-dark); margin-bottom: 4px; font-size: 13px; }
.tooltip .tt-text { color: var(--text-2); line-height: 1.4; }
.tooltip::after {
  content: ''; position: absolute; width: 0; height: 0;
}
.tooltip.tt-left  { right: calc(100% + 12px); top: 50%; transform: translateY(-50%); }
.tooltip.tt-right { left: calc(100% + 12px);  top: 50%; transform: translateY(-50%); }
.tooltip.tt-top   { bottom: calc(100% + 12px); left: 50%; transform: translateX(-50%); }
.tooltip.tt-bottom{ top: calc(100% + 12px);    left: 50%; transform: translateX(-50%); }
.tooltip.tt-left::after  { left: 100%; top: 50%; transform: translateY(-50%);
  border: 8px solid transparent; border-left-color: var(--green); }
.tooltip.tt-right::after { right: 100%; top: 50%; transform: translateY(-50%);
  border: 8px solid transparent; border-right-color: var(--green); }
.tooltip.tt-top::after   { top: 100%; left: 50%; transform: translateX(-50%);
  border: 8px solid transparent; border-top-color: var(--green); }
.tooltip.tt-bottom::after{ bottom: 100%; left: 50%; transform: translateX(-50%);
  border: 8px solid transparent; border-bottom-color: var(--green); }

/* Phone navigation buttons */
.phone-nav {
  display: flex; gap: 8px; margin-top: 16px;
}
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px;
  border-radius: 10px; font-weight: 600; font-size: 14px; transition: all .15s;
  white-space: nowrap;
}
.btn-primary { background: var(--green); color: var(--white); }
.btn-primary:hover { background: var(--green-dark); }
.btn-primary:disabled { background: #ccc; cursor: not-allowed; }
.btn-ghost { background: var(--white); border: 1.5px solid var(--border); color: var(--text); }
.btn-ghost:hover { border-color: var(--green); color: var(--green); }
.btn-ghost:disabled { opacity: .4; cursor: not-allowed; }

/* ----- GUIDE PANEL (right) ----- */
.right-panel {
  display: flex; flex-direction: column; gap: 16px;
  position: sticky; top: 70px; max-height: calc(100vh - 90px); overflow-y: auto;
}
.guide-card, .chat-card {
  background: var(--white); border-radius: 14px; padding: 18px;
  box-shadow: var(--shadow-sm);
}
.guide-card h2 {
  font-size: 17px; color: var(--green-dark); margin-bottom: 4px;
}
.guide-card .sub { color: var(--text-2); font-size: 13px; margin-bottom: 14px; }
.guide-list { display: flex; flex-direction: column; gap: 14px; }
.guide-item {
  border-left: 3px solid var(--green); padding-left: 12px;
}
.guide-item h4 { font-size: 14px; margin-bottom: 4px; color: var(--text); }
.guide-item p { font-size: 13px; color: var(--text-2); }
.guide-item .note {
  margin-top: 6px; padding: 8px 10px; background: var(--warn-bg); border-radius: 6px;
  font-size: 12px; color: #92400e; border-left: 3px solid var(--warn);
}
.tip-box {
  margin-top: 14px; padding: 12px; background: var(--green-light); border-radius: 10px;
  font-size: 13px; color: var(--green-dark); border: 1px solid var(--green-soft);
}
.tip-box strong { display: block; margin-bottom: 4px; }

/* ----- CHAT PANEL ----- */
.chat-card { display: flex; flex-direction: column; min-height: 340px; }
.chat-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.chat-header .ch-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%;
  animation: pulse-dot 2s infinite; }
@keyframes pulse-dot { 50% { opacity: .4; } }
.chat-header h3 { font-size: 14px; }
.chat-header .ch-clear {
  margin-left: auto; font-size: 11px; color: var(--text-3); padding: 4px 8px;
  border-radius: 6px;
}
.chat-header .ch-clear:hover { background: var(--bg); color: var(--text); }
.chat-messages {
  flex: 1; overflow-y: auto; max-height: 280px; min-height: 180px;
  display: flex; flex-direction: column; gap: 8px; padding: 4px 0;
}
.msg {
  padding: 8px 12px; border-radius: 12px; max-width: 85%; font-size: 13px; line-height: 1.45;
  word-wrap: break-word;
}
.msg.bot { background: var(--green-soft); color: var(--text); align-self: flex-start;
  border-bottom-left-radius: 4px; }
.msg.user { background: var(--green); color: var(--white); align-self: flex-end;
  border-bottom-right-radius: 4px; }
.msg.err { background: #fee; color: #c00; align-self: stretch; border: 1px solid #fcc; }
.msg.bot.typing { color: var(--text-3); font-style: italic; }
.chat-form {
  display: flex; gap: 6px; margin-top: 10px; padding-top: 10px;
  border-top: 1px solid var(--border);
}
.chat-form input {
  flex: 1; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 10px;
  outline: none; transition: border-color .15s;
}
.chat-form input:focus { border-color: var(--green); }
.chat-form button {
  padding: 10px 14px; background: var(--green); color: var(--white);
  border-radius: 10px; font-weight: 600;
}
.chat-form button:disabled { background: #ccc; cursor: not-allowed; }
.chat-suggest {
  display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px;
}
.chat-suggest button {
  padding: 6px 10px; background: var(--white); border: 1px solid var(--border);
  border-radius: 14px; font-size: 12px; color: var(--text-2); transition: all .15s;
}
.chat-suggest button:hover { border-color: var(--green); color: var(--green); }
.api-banner {
  font-size: 11px; padding: 6px 8px; border-radius: 6px;
  background: var(--warn-bg); color: #92400e; margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
}
.api-banner button {
  margin-left: auto; color: #92400e; text-decoration: underline; font-size: 11px;
}

/* ============================================================
   TABLET (768-1023): hide sidebar
   ============================================================ */
@media (max-width: 1023px) {
  main.grid { grid-template-columns: 1fr 360px; }
  aside.sidebar { display: none; }
}

/* ============================================================
   MOBILE (<768): bottom sheet + FAB chat
   ============================================================ */
@media (max-width: 767px) {
  :root {
    --phone-w: 230px;
    --screen-w: 216px;
    --screen-h: 480px;
    --scale: 0.5538; /* 216/390 */
  }
  body { font-size: 14px; }
  header.top-bar { padding: 8px 12px; gap: 8px; }
  .logo span { display: none; }
  .module-title { font-size: 13px; }
  .module-title small { font-size: 10px; }
  .progress-pill { padding: 4px 8px; font-size: 11px; }
  .progress-bar { width: 40px; }

  main.grid {
    grid-template-columns: 1fr;
    padding: 12px; gap: 12px;
    padding-bottom: 90px; /* room for fixed nav */
  }
  .demo-wrap { padding: 12px; position: static; }
  .phone-frame { height: 500px; }
  .right-panel { position: static; max-height: none; overflow: visible; }

  /* Mobile bottom sheet */
  .mobile-pills {
    display: flex; gap: 6px; overflow-x: auto; padding: 4px 0; margin-bottom: 8px;
    scrollbar-width: none;
    /* Mobile-pills is flex item của .demo-wrap (cũng flex column).
       Force width 100% + min-width 0 để clamp vào width của demo-wrap (đã được min-width:0 grid),
       và scroll-x nội bộ thay vì grow theo nội dung. */
    width: 100%; min-width: 0; max-width: 100%;
    align-self: stretch;
  }
  .mobile-pills::-webkit-scrollbar { display: none; }
  .pill {
    flex-shrink: 0; padding: 6px 12px; background: var(--white);
    border: 1.5px solid var(--border); border-radius: 14px;
    font-size: 12px; font-weight: 600; white-space: nowrap;
  }
  .pill.active { background: var(--green); color: var(--white); border-color: var(--green); }
  .pill.done { border-color: var(--green); color: var(--green); }

  /* Mobile: tooltip render inline dưới phone, không absolute */
  .tooltip {
    position: static !important;
    transform: none !important;
    top: auto !important; left: auto !important; right: auto !important; bottom: auto !important;
    margin: 14px 0 0; max-width: 100%; min-width: 0;
  }
  .tooltip::after { display: none; }

  /* Chat fullscreen on mobile */
  .chat-card { display: none; }
  .chat-card.show-mobile {
    display: flex; position: fixed; inset: 0; z-index: 200;
    border-radius: 0; padding: 16px; padding-top: 60px;
  }
  .chat-card.show-mobile .chat-messages { max-height: none; flex: 1; }
  .chat-close-mobile {
    position: absolute; top: 12px; right: 12px; width: 36px; height: 36px;
    border-radius: 50%; background: var(--bg); display: grid; place-items: center;
    font-size: 20px;
  }

  /* FAB chat */
  .fab-chat {
    position: fixed; bottom: 80px; right: 16px; z-index: 30;
    width: 52px; height: 52px; border-radius: 50%; background: var(--green);
    color: var(--white); font-size: 22px; box-shadow: var(--shadow-lg);
    display: grid; place-items: center;
  }

  /* Fixed bottom nav */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
    background: var(--white); border-top: 1px solid var(--border);
    padding: 10px 12px; display: flex; gap: 8px;
    box-shadow: 0 -2px 12px rgba(0,0,0,.08);
  }
  .bottom-nav .btn { flex: 1; justify-content: center; padding: 12px; }
}

/* Hide mobile-only on desktop */
.mobile-pills, .fab-chat, .bottom-nav, .chat-close-mobile { display: none; }
@media (max-width: 767px) {
  .mobile-pills, .fab-chat, .bottom-nav { display: flex; }
}

/* Hide phone-nav on mobile (use bottom-nav instead) */
@media (max-width: 767px) {
  .phone-nav { display: none; }
}
</style>
</head>
<body>

<!-- ============================================================
     STATE: LOADING
     ============================================================ -->
<div id="state-loading" class="state-screen">
  <div class="state-card">
    <div class="spinner"></div>
    <h2>Đang tải module…</h2>
    <p>Đọc dữ liệu từ <code>data/modules.json</code></p>
  </div>
</div>

<!-- ============================================================
     STATE: ERROR
     ============================================================ -->
<div id="state-error" class="state-screen" hidden>
  <div class="state-card">
    <div class="icon">⚠️</div>
    <h2 id="err-title">Không tải được dữ liệu</h2>
    <p id="err-msg">Kiểm tra file modules.json hoặc đường dẫn module.</p>
    <div id="err-detail" class="err-detail" hidden></div>
    <button class="btn btn-primary" onclick="location.reload()">🔄 Thử lại</button>
    <button class="btn btn-ghost" onclick="location.href='index.html'" style="margin-left:8px">🏠 Về trang chủ</button>
  </div>
</div>

<!-- ============================================================
     STATE: MODULE PICKER (no ?module param)
     ============================================================ -->
<div id="state-picker" class="state-screen" hidden>
  <div class="state-card">
    <div class="icon">📚</div>
    <h2>Chọn module để học</h2>
    <p>Hệ thống đào tạo App Nhà Phố</p>
    <div id="picker-list" class="picker-list"></div>
  </div>
</div>

<!-- ============================================================
     APP — main UI
     ============================================================ -->
<div id="app" class="app">
  <header class="top-bar">
    <a href="index.html" class="btn-back" title="Về trang chủ">← Về</a>
    <div class="logo">
      <span class="logo-dot">N</span>
      <span>Nhà Phố Training</span>
    </div>
    <div class="module-title" id="module-title">
      Module<small id="module-sub">—</small>
    </div>
    <div class="progress-pill">
      <span id="progress-text">1/12</span>
      <div class="progress-bar"><span id="progress-fill" style="width:8%"></span></div>
    </div>
  </header>

  <main class="grid">
    <!-- SIDEBAR (desktop only) -->
    <aside class="sidebar">
      <h3>📋 Các bước</h3>
      <div class="step-list" id="step-list"></div>
    </aside>

    <!-- PHONE DEMO (center) -->
    <div class="demo-wrap">
      <!-- Mobile pills (hidden desktop) -->
      <div class="mobile-pills" id="mobile-pills"></div>

      <div class="phone-container">
        <div class="phone-frame">
          <div class="phone-notch"></div>
          <div class="phone-screen" id="phone-screen">
            <img class="bg" id="phone-bg" alt="">
            <div class="dim-overlay"></div>
            <div class="hotspot" id="hotspot"></div>
          </div>
        </div>
        <div class="tooltip" id="tooltip">
          <div class="tt-title" id="tt-title">—</div>
          <div class="tt-text" id="tt-text">—</div>
        </div>
      </div>

      <div class="phone-nav">
        <button class="btn btn-ghost" id="btn-prev">← Trước</button>
        <button class="btn btn-primary" id="btn-next">Tiếp →</button>
      </div>
    </div>

    <!-- RIGHT PANEL: GUIDE + CHAT -->
    <div class="right-panel">
      <div class="guide-card">
        <h2 id="guide-title">—</h2>
        <div class="sub" id="guide-sub">—</div>
        <div class="guide-list" id="guide-list"></div>
        <div class="tip-box" id="tip-box" hidden>
          <strong>💡 Lưu ý</strong>
          <span id="tip-text">—</span>
        </div>
      </div>

      <div class="chat-card" id="chat-card">
        <button class="chat-close-mobile" onclick="toggleMobileChat(false)">✕</button>
        <div class="chat-header">
          <span class="ch-dot"></span>
          <h3>Trợ lý AI</h3>
          <button class="ch-clear" onclick="clearChat()">Xóa</button>
        </div>
        <div class="api-banner" id="api-banner" hidden>
          <span>🔑 Cần API key Claude</span>
          <button onclick="promptApiKey()">Nhập key</button>
        </div>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-suggest" id="chat-suggest"></div>
        <form class="chat-form" id="chat-form" onsubmit="event.preventDefault(); sendChat();">
          <input type="text" id="chat-input" placeholder="Hỏi về bước này…" autocomplete="off">
          <button type="submit" id="chat-send">Gửi</button>
        </form>
      </div>
    </div>
  </main>

  <!-- Mobile bottom nav -->
  <nav class="bottom-nav">
    <button class="btn btn-ghost" id="btn-prev-m">← Trước</button>
    <button class="btn btn-primary" id="btn-next-m">Tiếp →</button>
  </nav>
  <button class="fab-chat" onclick="toggleMobileChat(true)" title="Hỏi AI">💬</button>
</div>

<script>
/* ============================================================
   ENGINE STATE
   ============================================================ */
const STATE = {
  data: null,        // toàn bộ modules.json
  module: null,      // module hiện tại
  moduleId: null,
  steps: [],
  currentStep: 0,    // 0-indexed
  apiKey: null,
  history: [],       // chat history
};

/* ============================================================
   BOOTSTRAP — đọc query param + fetch JSON
   ============================================================ */
window.addEventListener('DOMContentLoaded', boot);

async function boot() {
  // Lấy module từ ?module=xxx
  const params = new URLSearchParams(location.search);
  const moduleId = params.get('module');

  // Load API key từ localStorage
  STATE.apiKey = localStorage.getItem('np_api_key') || null;

  try {
    const data = await fetchModulesJson();
    STATE.data = data;

    if (!moduleId) {
      // Không có param → hiện picker
      renderPicker(data);
      return;
    }

    const mod = data.modules?.[moduleId];
    if (!mod) {
      showError('Module không tồn tại',
        `Không tìm thấy module "${moduleId}" trong modules.json.`,
        `Các module có sẵn: ${Object.keys(data.modules || {}).join(', ')}`);
      return;
    }

    STATE.module = mod;
    STATE.moduleId = moduleId;
    STATE.steps = mod.steps || [];
    if (STATE.steps.length === 0) {
      showError('Module rỗng', 'Module này chưa có bước nào.');
      return;
    }

    initApp();
  } catch (err) {
    console.error(err);
    showError('Không tải được modules.json',
      'Kiểm tra đường dẫn file hoặc chạy qua HTTP server (không mở trực tiếp).',
      err.message);
  }
}

async function fetchModulesJson() {
  // Thử các path phổ biến
  const candidates = ['data/modules.json', './data/modules.json', '../data/modules.json'];
  let lastErr;
  for (const url of candidates) {
    try {
      const res = await fetch(url, { cache: 'no-cache' });
      if (res.ok) return await res.json();
      lastErr = new Error(`HTTP ${res.status} từ ${url}`);
    } catch (e) {
      lastErr = e;
    }
  }
  throw lastErr || new Error('Không tìm thấy modules.json');
}

/* ============================================================
   STATE SCREENS
   ============================================================ */
function showError(title, msg, detail) {
  hideAll();
  document.getElementById('err-title').textContent = title;
  document.getElementById('err-msg').textContent = msg;
  const d = document.getElementById('err-detail');
  if (detail) { d.textContent = detail; d.hidden = false; }
  document.getElementById('state-error').hidden = false;
}
function hideAll() {
  document.getElementById('state-loading').hidden = true;
  document.getElementById('state-error').hidden = true;
  document.getElementById('state-picker').hidden = true;
  document.getElementById('app').classList.remove('active');
}

function renderPicker(data) {
  hideAll();
  const list = document.getElementById('picker-list');
  list.innerHTML = '';
  for (const [id, mod] of Object.entries(data.modules || {})) {
    const btn = document.createElement('a');
    btn.className = 'picker-item';
    btn.href = `?module=${id}`;
    btn.innerHTML = `
      <div class="pi-icon">${mod.icon || '📘'}</div>
      <div class="pi-info">
        <div class="pi-name">${escapeHtml(mod.name)}</div>
        <div class="pi-desc">${escapeHtml(mod.role || '')} · ${mod.steps?.length || 0} bước</div>
      </div>
      <div class="pi-arrow">→</div>
    `;
    list.appendChild(btn);
  }
  document.getElementById('state-picker').hidden = false;
}

/* ============================================================
   INIT APP
   ============================================================ */
function initApp() {
  hideAll();
  document.getElementById('app').classList.add('active');

  // Header
  document.getElementById('module-title').innerHTML =
    `${STATE.module.icon || ''} ${escapeHtml(STATE.module.name)}<small>${escapeHtml(STATE.module.role || '')}</small>`;

  // Render sidebar steps + mobile pills
  renderStepList();

  // Bind nav buttons
  document.getElementById('btn-prev').onclick = prevStep;
  document.getElementById('btn-next').onclick = nextStep;
  document.getElementById('btn-prev-m').onclick = prevStep;
  document.getElementById('btn-next-m').onclick = nextStep;

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'ArrowRight') nextStep();
    else if (e.key === 'ArrowLeft') prevStep();
  });

  // API key check
  if (!STATE.apiKey) document.getElementById('api-banner').hidden = false;

  goToStep(0);
}

function renderStepList() {
  const sb = document.getElementById('step-list');
  const pills = document.getElementById('mobile-pills');
  sb.innerHTML = '';
  pills.innerHTML = '';
  STATE.steps.forEach((s, i) => {
    // Sidebar item
    const btn = document.createElement('button');
    btn.className = 'step-item';
    btn.dataset.idx = i;
    btn.innerHTML = `
      <span class="step-num">${i + 1}</span>
      <div class="step-info">
        <div class="si-name">${escapeHtml(s.name || `Bước ${i+1}`)}</div>
        <div class="si-desc">${escapeHtml(s.desc || '')}</div>
      </div>
    `;
    btn.onclick = () => goToStep(i);
    sb.appendChild(btn);

    // Mobile pill
    const pill = document.createElement('button');
    pill.className = 'pill';
    pill.dataset.idx = i;
    pill.textContent = `${i + 1}`;
    pill.title = s.name || `Bước ${i+1}`;
    pill.onclick = () => goToStep(i);
    pills.appendChild(pill);
  });
}

/* ============================================================
   NAVIGATION
   ============================================================ */
function goToStep(idx) {
  if (idx < 0 || idx >= STATE.steps.length) return;
  STATE.currentStep = idx;
  renderStep();
}
function nextStep() { if (STATE.currentStep < STATE.steps.length - 1) goToStep(STATE.currentStep + 1); }
function prevStep() { if (STATE.currentStep > 0) goToStep(STATE.currentStep - 1); }

/* ============================================================
   RENDER STEP
   ============================================================ */
function renderStep() {
  const idx = STATE.currentStep;
  const s = STATE.steps[idx];
  const total = STATE.steps.length;

  // Progress
  document.getElementById('progress-text').textContent = `${idx + 1}/${total}`;
  document.getElementById('progress-fill').style.width = `${((idx + 1) / total) * 100}%`;

  // Sidebar active
  document.querySelectorAll('.step-item').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
    el.classList.toggle('done', i < idx);
  });
  // Mobile pills
  document.querySelectorAll('.pill').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
    el.classList.toggle('done', i < idx);
    if (i === idx) el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  });

  // Phone background image
  // Hỗ trợ cả `img` (dang_tin) và `imgKey` (loc_kho, bo_suu_tap)
  const imgKey = s.img || s.imgKey;
  const imgPath = STATE.module.images?.[imgKey];
  const phoneBg = document.getElementById('phone-bg');
  if (imgPath) {
    if (phoneBg.src.indexOf(imgPath) === -1) phoneBg.src = imgPath;
    phoneBg.alt = s.name || '';
  }

  // ScrollY in 390 space → translate by SCALE
  const scrollY = Math.max(0, s.scrollY || 0);
  const scale = getScale();
  phoneBg.style.top = `${-scrollY * scale}px`;

  // Hotspot
  const hs = s.hs || { x: 0, y: 0, w: 0, h: 0 };
  const hotEl = document.getElementById('hotspot');
  hotEl.style.left   = `${hs.x * scale}px`;
  hotEl.style.top    = `${(hs.y - scrollY) * scale}px`;
  hotEl.style.width  = `${hs.w * scale}px`;
  hotEl.style.height = `${hs.h * scale}px`;

  // Tooltip — position OUTSIDE phone frame, align với hotspot
  const tt = document.getElementById('tooltip');
  document.getElementById('tt-title').textContent = s.ttTitle || '';
  document.getElementById('tt-text').textContent = s.ttText || '';
  let pos = s.ttPos || 'right';
  // Dưới desktop (< 1024px) phone không có đủ space 2 bên → force bottom
  if (window.innerWidth < 1024 && (pos === 'left' || pos === 'right')) pos = 'bottom';

  // Tọa độ trung tâm hotspot trong phone-container (frame có padding 8px)
  const hsCx = (hs.x + hs.w / 2) * scale + 8;
  const hsCy = (hs.y - scrollY + hs.h / 2) * scale + 8;

  // Reset inline + class, rồi set theo pos
  tt.removeAttribute('style');
  tt.className = `tooltip tt-${pos}`;
  if (pos === 'left') {
    tt.style.right = 'calc(100% + 12px)';
    tt.style.top = `${hsCy}px`;
    tt.style.transform = 'translateY(-50%)';
  } else if (pos === 'right') {
    tt.style.left = 'calc(100% + 12px)';
    tt.style.top = `${hsCy}px`;
    tt.style.transform = 'translateY(-50%)';
  } else if (pos === 'top') {
    tt.style.bottom = 'calc(100% + 12px)';
    tt.style.left = `${hsCx}px`;
    tt.style.transform = 'translateX(-50%)';
  } else { // bottom
    tt.style.top = 'calc(100% + 12px)';
    tt.style.left = `${hsCx}px`;
    tt.style.transform = 'translateX(-50%)';
  }

  // Guide panel
  document.getElementById('guide-title').textContent = s.title || s.name || `Bước ${idx + 1}`;
  document.getElementById('guide-sub').textContent = s.sub || '';
  const list = document.getElementById('guide-list');
  list.innerHTML = '';
  (s.guide || []).forEach(g => {
    const div = document.createElement('div');
    div.className = 'guide-item';
    div.innerHTML = `
      <h4>${escapeHtml(g.title || '')}</h4>
      <p>${escapeHtml(g.body || '')}</p>
      ${g.note ? `<div class="note">⚠️ ${escapeHtml(g.note)}</div>` : ''}
    `;
    list.appendChild(div);
  });
  // Tip
  const tipBox = document.getElementById('tip-box');
  if (s.tip) {
    document.getElementById('tip-text').textContent = s.tip;
    tipBox.hidden = false;
  } else {
    tipBox.hidden = true;
  }

  // Nav button states
  document.getElementById('btn-prev').disabled = (idx === 0);
  document.getElementById('btn-prev-m').disabled = (idx === 0);
  document.getElementById('btn-next').disabled = (idx === total - 1);
  document.getElementById('btn-next-m').disabled = (idx === total - 1);
  document.getElementById('btn-next').textContent = (idx === total - 1) ? '✓ Hoàn thành' : 'Tiếp →';
  document.getElementById('btn-next-m').textContent = (idx === total - 1) ? '✓ Hoàn thành' : 'Tiếp →';

  // Suggest chips
  renderChatSuggest(s);
}

function getScale() {
  // Đọc CSS variable để khớp breakpoint
  const v = getComputedStyle(document.documentElement).getPropertyValue('--scale').trim();
  return parseFloat(v) || 0.6513;
}
window.addEventListener('resize', () => { if (STATE.module) renderStep(); });

/* ============================================================
   CHAT — Claude API client-side
   ============================================================ */
function renderChatSuggest(step) {
  const wrap = document.getElementById('chat-suggest');
  wrap.innerHTML = '';
  const suggests = [
    `Tại sao có bước này?`,
    `Có cách nào khác không?`,
    `Lỗi thường gặp?`,
  ];
  suggests.forEach(q => {
    const b = document.createElement('button');
    b.textContent = q;
    b.onclick = () => { document.getElementById('chat-input').value = q; sendChat(); };
    wrap.appendChild(b);
  });
}

function clearChat() {
  STATE.history = [];
  document.getElementById('chat-messages').innerHTML = '';
  addBotMsg(`Xin chào! Hỏi tôi bất cứ điều gì về bước "${STATE.steps[STATE.currentStep].name}".`);
}

function addBotMsg(text, cls = '') {
  const div = document.createElement('div');
  div.className = `msg bot ${cls}`;
  div.textContent = text;
  const box = document.getElementById('chat-messages');
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  return div;
}
function addUserMsg(text) {
  const div = document.createElement('div');
  div.className = 'msg user';
  div.textContent = text;
  const box = document.getElementById('chat-messages');
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}
function addErrMsg(text) {
  const div = document.createElement('div');
  div.className = 'msg err';
  div.textContent = text;
  document.getElementById('chat-messages').appendChild(div);
}

function promptApiKey() {
  const k = prompt('Nhập Anthropic API key (sk-ant-…). Lưu trong trình duyệt của bạn, không gửi đi đâu khác.');
  if (k && k.startsWith('sk-')) {
    STATE.apiKey = k.trim();
    localStorage.setItem('np_api_key', STATE.apiKey);
    document.getElementById('api-banner').hidden = true;
    addBotMsg('✓ Đã lưu API key. Bạn có thể bắt đầu hỏi.');
  } else if (k !== null) {
    alert('Key không hợp lệ. Phải bắt đầu bằng sk-…');
  }
}

function buildSystemPrompt() {
  const s = STATE.steps[STATE.currentStep];
  return `Bạn là trợ lý AI của ${STATE.data.brand?.name || 'Nhà Phố Việt Nam'}, hỗ trợ học viên dùng ${STATE.data.brand?.app || 'App Nhà Phố'}.

NGỮ CẢNH HIỆN TẠI:
- Module: ${STATE.module.name}
- Vai trò người học: ${STATE.module.role || ''}
- Bước đang học (${STATE.currentStep + 1}/${STATE.steps.length}): ${s.title || s.name}
- Mô tả: ${s.sub || ''}
- Lưu ý: ${s.tip || 'không có'}

QUY TẮC TRẢ LỜI:
- Tiếng Việt, ngắn gọn (≤4 câu trừ khi user yêu cầu chi tiết)
- Tập trung vào BƯỚC HIỆN TẠI, không đi xa
- Dùng động từ hành động, tránh "Xin vui lòng", "Hãy thử"
- Nếu câu hỏi ngoài app → trả lời ngắn rồi gợi ý quay lại bước
- Nếu cần liên hệ hỗ trợ: hotline ${STATE.data.brand?.hotline || '1900 0266'}`;
}

async function sendChat() {
  const input = document.getElementById('chat-input');
  const q = input.value.trim();
  if (!q) return;

  if (!STATE.apiKey) {
    promptApiKey();
    if (!STATE.apiKey) return;
  }

  addUserMsg(q);
  input.value = '';
  STATE.history.push({ role: 'user', content: q });

  const sendBtn = document.getElementById('chat-send');
  sendBtn.disabled = true;
  const typing = addBotMsg('Đang suy nghĩ…', 'typing');

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': STATE.apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-5',
        max_tokens: 512,
        system: buildSystemPrompt(),
        messages: STATE.history.slice(-8), // giữ context ngắn
      }),
    });

    typing.remove();

    if (!res.ok) {
      const errBody = await res.text();
      let parsed;
      try { parsed = JSON.parse(errBody); } catch (e) { parsed = { error: { message: errBody } }; }
      const msg = parsed?.error?.message || `HTTP ${res.status}`;
      addErrMsg(`Lỗi: ${msg}`);
      if (res.status === 401) {
        STATE.apiKey = null;
        localStorage.removeItem('np_api_key');
        document.getElementById('api-banner').hidden = false;
      }
      STATE.history.pop();
      return;
    }

    const data = await res.json();
    const text = (data.content || []).filter(c => c.type === 'text').map(c => c.text).join('\n');
    addBotMsg(text || '(không có phản hồi)');
    STATE.history.push({ role: 'assistant', content: text });
  } catch (err) {
    typing.remove();
    addErrMsg(`Lỗi mạng: ${err.message}`);
    STATE.history.pop();
  } finally {
    sendBtn.disabled = false;
  }
}

function toggleMobileChat(show) {
  document.getElementById('chat-card').classList.toggle('show-mobile', show);
}

/* ============================================================
   UTIL
   ============================================================ */
function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}
</script>
